<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Hover</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- SECTION 1 -->
<section class="profile-section">
  <div class="profile-cards-wrap">

    <div class="profile-card">
      <div class="profile-image">
        <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&w=450&h=450&q=80" alt="Smiling man in yellow shirt and yellow beanie on yellow background">
      </div>
      <div class="info-panel">
        <p class="name">karan singah</p>
        <p class="job">Graphic Designer</p>
      </div>
    </div>

    <div class="profile-card">
      <div class="profile-image">
        <img src="https://images.unsplash.com/photo-1554151228-14d9def656e4?auto=format&fit=crop&w=450&h=450&q=80" alt="Woman with long dark hair in a pink sweater on a light grey background">
      </div>
      <div class="info-panel">
        <p class="name">dolly seth</p>
        <p class="job">Software Engineer</p>
      </div>
    </div>

    <div class="profile-card">
      <div class="profile-image">
        <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=450&h=450&q=80" alt="Man with glasses wearing a dark navy jacket on a light grey background">
      </div>
      <div class="info-panel">
        <p class="name">akash agarwala</p>
        <p class="job">Marketing</p>
      </div>
    </div>

  </div>
</section>

<!-- SECTION 2-->
<section class="option-section">

  <div class="option-row">

    <div class="option-card option-card-teal">
      <div class="corner-shape"></div>
        <span class="corner-arrow">&rarr;</span>
      <h3>This is option 1</h3>
      <p>Card description with lots of great facts and interesting details.</p>
    </div>

  

  <div class="option-row option-row-second">

    <div class="option-card option-card-house">
      <span class="house-icon"></span>
      <h3>This is option 2</h3>
      <p>Card description with lots of great facts and interesting details.</p>
      <div class="magenta-strip">
        <span class="strip-arrow">&rarr;</span>
      </div>
    </div>

  </div>

</section>

</body>
</html>
