<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Sector Development Program — Flip Card Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="page">
    <div class="scene">
      <input
        type="checkbox"
        id="flip-toggle"
        class="flip-toggle"
        aria-label="Flip card to reveal details on the back"
      />

      <div class="card-container">
        <div class="card-inner">

          <!-- FRONT FACE -->
          <section class="card-face card-front" aria-labelledby="front-title">
            <div class="front-bg-image"></div>
            <div class="front-gradient-overlay"></div>

            <div class="front-content">
              <div class="front-bottom">
                <h1 id="front-title" class="front-title">
                  Financial Sector<br>
                  Development<br>
                  Program
                </h1>
                <div class="circle-btn" aria-hidden="true">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7" y1="17" x2="17" y2="7"></line>
                    <polyline points="7 7 17 7 17 17"></polyline>
                  </svg>
                </div>
              </div>
            </div>
          </section>

          <!-- BACK FACE -->
          <section class="card-face card-back" aria-labelledby="back-title">
            <div class="back-top">
              <div class="map-icon-wrapper" aria-hidden="true">
                <!-- Tri-fold folded map outline icon matching Screenshot 1 -->
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#50c332" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"></path>
                  <line x1="9" y1="3" x2="9" y2="18"></line>
                  <line x1="15" y1="6" x2="15" y2="21"></line>
                </svg>
              </div>

              <h2 id="back-title" class="back-title">
                Financial Sector<br>
                Development<br>
                Program
              </h2>

              <p class="back-text">
                The Program aims to develop a diversified and effective financial sector to support the development of the Saudi Arabia's economy.
              </p>
            </div>

            <div class="back-footer">
              <button type="button" class="btn-read-more" aria-label="Read more about Financial Sector Development Program">
                <span>Read More</span>
                <svg class="arrow-right" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
            </div>
          </section>

        </div>
      </div>
    </div>
  </main>

</body>
</html>
